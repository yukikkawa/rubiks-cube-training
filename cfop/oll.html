<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLL 手順一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --border: #d8dce3;
      --text: #1a1a1a;
      --muted: #5f6368;
      --bg: #f4f5f7;
      --card: #fff;
      --accent: #1a73e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans JP", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(244, 245, 247, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.875rem;
      color: var(--muted);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .status {
      padding: 12px 16px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .status.error {
      color: #b3261e;
      border-color: #f5c2c0;
      background: #fff5f5;
    }

    .oll-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr));
      gap: 12px;
    }

    .oll-card {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 12px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      min-height: 132px;
    }

    .oll-image-wrap {
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 8px;
      overflow: hidden;
    }

    .oll-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .oll-image-placeholder {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      padding: 8px;
    }

    .oll-body {
      min-width: 0;
    }

    .oll-no {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      background: #e8f0fe;
      border-radius: 999px;
      padding: 2px 8px;
      margin-bottom: 6px;
    }

    .oll-name {
      margin: 0 0 4px;
      font-size: 1.05rem;
      font-weight: 700;
      word-break: break-word;
    }

    .oll-category {
      margin: 0 0 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .oll-algorithm {
      margin: 0;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .oll-memo {
      margin: 8px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .oll-card {
        grid-template-columns: 96px 1fr;
      }

      .oll-image-wrap {
        width: 96px;
        height: 96px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>OLL 手順一覧</h1>
    <p id="summary">読み込み中…</p>
  </header>
  <main>
    <div id="status" class="status">データを読み込んでいます…</div>
    <div id="oll-grid" class="oll-grid" hidden></div>
  </main>

  <script>
    const IMAGE_EXTENSIONS = ["png", "jpg", "jpeg", "webp", "gif", "svg"];

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (char === "\"" && next === "\"") {
            field += "\"";
            i += 1;
          } else if (char === "\"") {
            inQuotes = false;
          } else {
            field += char;
          }
          continue;
        }

        if (char === "\"") {
          inQuotes = true;
        } else if (char === ",") {
          row.push(field);
          field = "";
        } else if (char === "\n") {
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
        } else if (char === "\r") {
          // ignore
        } else {
          field += char;
        }
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field);
        rows.push(row);
      }

      if (rows.length === 0) {
        return [];
      }

      const headers = rows[0].map((header) => header.trim());
      return rows.slice(1)
        .filter((cells) => cells.some((cell) => cell.trim() !== ""))
        .map((cells) => {
          const entry = {};
          headers.forEach((header, index) => {
            entry[header] = (cells[index] ?? "").trim();
          });
          return entry;
        });
    }

    function imageCandidates(no) {
      const num = String(no).trim().padStart( 2, '0');
      const padded = num.padStart(2, "0");
      const bases = [`../images/oll${num}`, `images/${padded}`, `images/oll-${num}`, `images/oll-${padded}`];
      const paths = [];
      for (const base of bases) {
        for (const ext of IMAGE_EXTENSIONS) {
          paths.push(`${base}.${ext}`);
        }
      }
      return paths;
    }

    function loadImage(candidates) {
      return new Promise((resolve) => {
        let index = 0;

        const tryNext = () => {
          if (index >= candidates.length) {
            resolve(null);
            return;
          }

          const src = candidates[index];
          index += 1;
          const img = new Image();
          img.onload = () => resolve(src);
          img.onerror = tryNext;
          img.src = src;
        };

        tryNext();
      });
    }

    function createCard(entry) {
      const card = document.createElement("article");
      card.className = "oll-card";

      const imageWrap = document.createElement("div");
      imageWrap.className = "oll-image-wrap";

      const body = document.createElement("div");
      body.className = "oll-body";

      const no = document.createElement("span");
      no.className = "oll-no";
      no.textContent = `#${entry["No."]}`;

      const name = document.createElement("h2");
      name.className = "oll-name";
      name.textContent = entry["通称"] || "—";

      const category = document.createElement("p");
      category.className = "oll-category";
      const rate = entry["出現率"] ? ` · ${entry["出現率"]}` : "";
      category.textContent = `${entry["分類"] || ""}${rate}`.trim() || " ";

      const algorithm = document.createElement("p");
      algorithm.className = "oll-algorithm";
      algorithm.textContent = entry["手順"] || "—";

      body.append(no, name, category, algorithm);

      if (entry["メモ"] && entry["メモ"] !== "メモ") {
        const memo = document.createElement("p");
        memo.className = "oll-memo";
        memo.textContent = entry["メモ"];
        body.append(memo);
      }

      card.append(imageWrap, body);

      loadImage(imageCandidates(entry["No."])).then((src) => {
        if (src) {
          const img = document.createElement("img");
          img.src = src;
          img.alt = `OLL ${entry["No."]}`;
          imageWrap.append(img);
        } else {
          const placeholder = document.createElement("div");
          placeholder.className = "oll-image-placeholder";
          placeholder.textContent = "画像なし";
          imageWrap.append(placeholder);
        }
      });

      return card;
    }

    async function init() {
      const status = document.getElementById("status");
      const grid = document.getElementById("oll-grid");
      const summary = document.getElementById("summary");

      try {
        const response = await fetch("oll_def.csv");
        if (!response.ok) {
          throw new Error(`oll_def.csv の読み込みに失敗しました (${response.status})`);
        }

        const text = await response.text();
        const entries = parseCsv(text);

        if (entries.length === 0) {
          throw new Error("oll_def.csv にデータがありません");
        }

        status.hidden = true;
        grid.hidden = false;
        summary.textContent = `${entries.length} ケース`;

        const fragment = document.createDocumentFragment();
        for (const entry of entries) {
          fragment.append(createCard(entry));
        }
        grid.append(fragment);
      } catch (error) {
        status.className = "status error";
        status.textContent = `${error.message}。ローカルサーバー経由で開いてください（例: \`npx serve .\`）。`;
        summary.textContent = "読み込み失敗";
      }
    }

    init();
  </script>
</body>

</html>
