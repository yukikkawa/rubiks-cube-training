<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLL 手順一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --border: #d8dce3;
      --text: #1a1a1a;
      --muted: #5f6368;
      --bg: #f4f5f7;
      --card: #fff;
      --accent: #1a73e8;
      --tag-filter-transition-duration: 0.3s;
      --tag-filter-transition: opacity var(--tag-filter-transition-duration) ease, max-height var(--tag-filter-transition-duration) ease, margin-top var(--tag-filter-transition-duration) ease, visibility var(--tag-filter-transition-duration) ease;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans JP", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(244, 245, 247, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .filter-modes {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .mode-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      line-height: 1.2;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .mode-btn:hover {
      border-color: #b8c4d9;
      background: #f8faff;
    }

    .mode-btn.active {
      border-color: var(--accent);
      background: #e8f0fe;
      color: var(--accent);
      font-weight: 700;
    }

    .tag-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      transition: var(--tag-filter-transition);
      max-height: 500px;
      overflow: hidden;
    }

    .tag-filter.is-hidden {
      max-height: 0;
      margin-top: 0;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    .tag-filter[hidden] {
      display: none;
    }

    .tag-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      line-height: 1.2;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .tag-btn:hover {
      border-color: #b8c4d9;
      background: #f8faff;
    }

    .tag-btn.active {
      border-color: var(--accent);
      background: #e8f0fe;
      color: var(--accent);
      font-weight: 700;
    }

    .empty-filter {
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .status {
      padding: 12px 16px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .status.error {
      color: #b3261e;
      border-color: #f5c2c0;
      background: #fff5f5;
    }

    .oll-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr));
      gap: 12px;
    }

    .oll-card {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 12px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      min-height: 132px;
    }

    .oll-card.is-filtered-out {
      display: none !important;
    }

    .oll-image-wrap {
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 8px;
      overflow: hidden;
    }

    .oll-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .oll-image-placeholder {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      padding: 8px;
    }

    .oll-body {
      min-width: 0;
    }

    .oll-no {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      background: #e8f0fe;
      border-radius: 999px;
      padding: 2px 8px;
      margin-bottom: 8px;
    }

    .oll-algorithm {
      margin: 0 0 10px;
      font-family: "JetBrains Mono", monospace;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .oll-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .oll-category,
    .oll-name {
      margin: 0;
      font-size: 0.8125rem;
      color: var(--muted);
      line-height: 1.45;
      word-break: break-word;
    }

    .oll-name {
      font-weight: 500;
    }

    .oll-memo {
      margin: 8px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .oll-card {
        grid-template-columns: 96px 1fr;
      }

      .oll-image-wrap {
        width: 96px;
        height: 96px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>OLL 手順一覧</h1>
    <p id="summary">読み込み中…</p>
    <div id="filter-modes" class="filter-modes" role="group" aria-label="絞り込み方法">
      <button class="mode-btn active" type="button" data-mode="all">すべて</button>
      <button class="mode-btn" type="button" data-mode="shape">形状</button>
      <button class="mode-btn" type="button" data-mode="order">覚える順</button>
    </div>
    <div id="tag-filter" class="tag-filter" hidden></div>
  </header>
  <main>
    <div id="status" class="status">データを読み込んでいます…</div>
    <div id="empty-filter" class="empty-filter" hidden>該当するケースがありません。</div>
    <div id="oll-grid" class="oll-grid" hidden></div>
  </main>

  <script>
    const IMAGE_EXTENSIONS = ["png", "jpg", "jpeg", "webp", "gif", "svg"];

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (char === "\"" && next === "\"") {
            field += "\"";
            i += 1;
          } else if (char === "\"") {
            inQuotes = false;
          } else {
            field += char;
          }
          continue;
        }

        if (char === "\"") {
          inQuotes = true;
        } else if (char === ",") {
          row.push(field);
          field = "";
        } else if (char === "\n") {
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
        } else if (char === "\r") {
          // ignore
        } else {
          field += char;
        }
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field);
        rows.push(row);
      }

      if (rows.length === 0) {
        return [];
      }

      const headers = rows[0].map((header) => header.trim());
      return rows.slice(1)
        .filter((cells) => cells.some((cell) => cell.trim() !== ""))
        .map((cells) => {
          const entry = {};
          headers.forEach((header, index) => {
            entry[header] = (cells[index] ?? "").trim();
          });
          return entry;
        });
    }

    function imageCandidates(no) {
      const num = String(no).trim().padStart( 2, '0');
      const padded = num.padStart(2, "0");
      const bases = [`../images/oll${num}`, `images/${padded}`, `images/oll-${num}`, `images/oll-${padded}`];
      const paths = [];
      for (const base of bases) {
        for (const ext of IMAGE_EXTENSIONS) {
          paths.push(`${base}.${ext}`);
        }
      }
      return paths;
    }

    function loadImage(candidates) {
      return new Promise((resolve) => {
        let index = 0;

        const tryNext = () => {
          if (index >= candidates.length) {
            resolve(null);
            return;
          }

          const src = candidates[index];
          index += 1;
          const img = new Image();
          img.onload = () => resolve(src);
          img.onerror = tryNext;
          img.src = src;
        };

        tryNext();
      });
    }

    function uniqueValues(entries, key) {
      const counts = new Map();
      for (const entry of entries) {
        const value = (entry[key] ?? "").trim();
        if (!value) {
          continue;
        }
        counts.set(value, (counts.get(value) ?? 0) + 1);
      }
      return [...counts.entries()]
        .sort(([a], [b]) => a.localeCompare(b, "ja"))
        .map(([value, count]) => ({ value, count }));
    }

    function getShape(entry) {
      return (entry["形状"] ?? "").trim();
    }

    function getLearnOrder(entry) {
      return (entry["覚える順"] ?? "").trim();
    }

    function getAufRotation(auf) {
      switch ((auf ?? "").trim().toLowerCase()) {
        case "y":
          return 90;
        case "y'":
          return -90;
        case "y2":
          return 180;
        default:
          return 0;
      }
    }

    function createCard(entry) {
      const card = document.createElement("article");
      card.className = "oll-card";
      card.setAttribute("data-shape", getShape(entry));
      card.setAttribute("data-order", getLearnOrder(entry));

      const imageWrap = document.createElement("div");
      imageWrap.className = "oll-image-wrap";

      const body = document.createElement("div");
      body.className = "oll-body";

      const no = document.createElement("span");
      no.className = "oll-no";
      no.textContent = `#${entry["No."]}`;

      const algorithm = document.createElement("p");
      algorithm.className = "oll-algorithm";
      algorithm.textContent = entry["手順"] || "—";

      const meta = document.createElement("div");
      meta.className = "oll-meta";

      const categoryLine = document.createElement("p");
      categoryLine.className = "oll-category";
      const rate = entry["出現率"] ? ` · ${entry["出現率"]}` : "";
      categoryLine.textContent = `${getShape(entry)}${rate}`.trim() || "—";

      const name = document.createElement("p");
      name.className = "oll-name";
      name.textContent = entry["通称"] || "—";

      meta.append(categoryLine, name);
      body.append(no, algorithm, meta);

      if (entry["メモ"] && entry["メモ"] !== "メモ") {
        const memo = document.createElement("p");
        memo.className = "oll-memo";
        memo.textContent = entry["メモ"];
        body.append(memo);
      }

      card.append(imageWrap, body);

      loadImage(imageCandidates(entry["No."])).then((src) => {
        if (src) {
          const img = document.createElement("img");
          img.src = src;
          img.alt = `OLL ${entry["No."]}`;
          img.style.transform = `rotate(${getAufRotation(entry["AUF"])}deg)`;
          imageWrap.append(img);
        } else {
          const placeholder = document.createElement("div");
          placeholder.className = "oll-image-placeholder";
          placeholder.textContent = "画像なし";
          imageWrap.append(placeholder);
        }
      });

      return card;
    }

    function createTagFilter(values, label, onSelect) {
      const container = document.createElement("div");
      container.className = "tag-filter";
      container.setAttribute("role", "group");
      container.setAttribute("aria-label", `${label}で絞り込み`);

      const allButton = document.createElement("button");
      allButton.type = "button";
      allButton.className = "tag-btn active";
      allButton.setAttribute("data-tag", "");
      allButton.textContent = "すべて";
      allButton.addEventListener("click", () => onSelect(""));
      container.append(allButton);

      for (const { value, count } of values) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tag-btn";
        button.setAttribute("data-tag", value);
        button.textContent = `${value} (${count})`;
        button.addEventListener("click", () => onSelect(value));
        container.append(button);
      }

      return container;
    }

    function getTagValue(button) {
      return button.getAttribute("data-tag") ?? "";
    }

    function applyTagFilter(selectedTag, mode, gridEl, summary, emptyFilter, tagFilter) {
      const cards = gridEl.querySelectorAll(".oll-card");
      let visibleCount = 0;
      const dataAttribute = mode === "shape" ? "data-shape" : "data-order";

      for (const card of cards) {
        const value = card.getAttribute(dataAttribute) ?? "";
        const visible = selectedTag === "" || value === selectedTag;
        card.classList.toggle("is-filtered-out", !visible);
        if (visible) {
          visibleCount += 1;
        }
      }

      for (const button of tagFilter.querySelectorAll(".tag-btn")) {
        button.classList.toggle("active", getTagValue(button) === selectedTag);
      }

      emptyFilter.hidden = visibleCount > 0;
      gridEl.hidden = visibleCount === 0;

      if (selectedTag) {
        summary.textContent = `${visibleCount} / ${cards.length} ケース（${selectedTag}）`;
      } else {
        summary.textContent = `${cards.length} ケース`;
      }
    }

    async function init() {
      const status = document.getElementById("status");
      const grid = document.getElementById("oll-grid");
      const summary = document.getElementById("summary");
      const tagFilterRoot = document.getElementById("tag-filter");
      const modeButtons = document.querySelectorAll(".mode-btn");
      const emptyFilter = document.getElementById("empty-filter");

      try {
        const response = await fetch("oll_def.csv");
        if (!response.ok) {
          throw new Error(`oll_def.csv の読み込みに失敗しました (${response.status})`);
        }

        const text = await response.text();
        const entries = parseCsv(text);

        if (entries.length === 0) {
          throw new Error("oll_def.csv にデータがありません");
        }

        status.hidden = true;
        grid.hidden = false;
        summary.textContent = `${entries.length} ケース`;

        const fragment = document.createDocumentFragment();
        for (const entry of entries) {
          fragment.append(createCard(entry));
        }
        grid.append(fragment);

        let tagFilter = tagFilterRoot;
        let selectedMode = "all";

        const selectMode = (mode) => {
          selectedMode = mode;
          for (const button of modeButtons) {
            button.classList.toggle("active", button.dataset.mode === mode);
          }

          if (mode === "all") {
            tagFilter.hidden = true;
            tagFilter.classList.remove("is-hidden");
            applyTagFilter("", mode, grid, summary, emptyFilter, tagFilter);
            return;
          }

          const key = mode === "shape" ? "形状" : "覚える順";
          const label = mode === "shape" ? "形状" : "覚える順";
          const nextTagFilter = createTagFilter(uniqueValues(entries, key), label, (tag) => {
            applyTagFilter(tag, selectedMode, grid, summary, emptyFilter, nextTagFilter);
          });
          tagFilter.replaceWith(nextTagFilter);
          tagFilter = nextTagFilter;
          tagFilter.hidden = false;
          setupScrollHideTagFilter(tagFilter);
          applyTagFilter("", mode, grid, summary, emptyFilter, tagFilter);
        };

        for (const button of modeButtons) {
          button.addEventListener("click", () => selectMode(button.dataset.mode));
        }

        selectMode("all");
      } catch (error) {
        status.className = "status error";
        status.textContent = `${error.message}。ローカルサーバー経由で開いてください（例: \`npx serve .\`）。`;
        summary.textContent = "読み込み失敗";
      }
    }
    
    function setupScrollHideTagFilter(tagFilterElement) {
        let lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
        let isHidden = false;
        let isTransitioning = false; // 状態変更中フラグ
        
        // 誤作動防止のための閾値（微小なスクロールで反応しないようにする）
        const THRESHOLD = 10; 
        // ヘッダーや要素自体の高さを考慮した最低スクロール量
        const TOP_OFFSET = 50; 
        // CSSの --tag-filter-transition-duration から取得（秒 → ミリ秒）
        const durationStr = getComputedStyle(document.documentElement).getPropertyValue('--tag-filter-transition-duration').trim();
        const TRANSITION_DURATION = parseFloat(durationStr) * 1000 * 1.05;

        window.addEventListener("scroll", () => {
            // 状態変更中はスクロールイベントを無視
            if (isTransitioning) {
                return;
            }

            const currentScrollY = window.pageYOffset || document.documentElement.scrollTop;
            const delta = currentScrollY - lastScrollY;

            // ページの最上部付近では常に表示
            if (currentScrollY <= TOP_OFFSET) {
                if (lastScrollY < TOP_OFFSET){
                    return;
                }

                if (isHidden) {
                    isTransitioning = true;
                    tagFilterElement.classList.remove("is-hidden");
                    isHidden = false;
                    setTimeout(() => {
                        isTransitioning = false;
                        lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
                    }, TRANSITION_DURATION);
                }
                lastScrollY = currentScrollY;
                return;
            }

            // スクロール量が小さすぎる場合は無視（手ぶれ対策）
            if (Math.abs(delta) < THRESHOLD) {
                return;
            }

            // 下スクロール ＝ 非表示 / 上スクロール ＝ 表示
            if (delta > 0) {
                if (!isHidden) {
                    isTransitioning = true;
                    tagFilterElement.classList.add("is-hidden");
                    isHidden = true;
                    setTimeout(() => {
                        isTransitioning = false;
                        lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
                    }, TRANSITION_DURATION);
                }
            } else if (delta < 0) {
                if (isHidden) {
                    isTransitioning = true;
                    tagFilterElement.classList.remove("is-hidden");
                    isHidden = false;
                    setTimeout(() => {
                        isTransitioning = false;
                        lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
                    }, TRANSITION_DURATION);
                }
            }

            lastScrollY = currentScrollY;
        });
    }
    init();
  </script>
</body>

</html>
