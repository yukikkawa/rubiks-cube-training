<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLL 手順一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="oll.css">
</head>

<body>
  <header>
    <div class="header-top">
      <div>
        <h1>OLL 手順一覧</h1>
        <p id="summary">読み込み中…</p>
      </div>
      <div class="csv-actions">
        <button id="import-csv-button" class="csv-action" type="button">CSV読み込み</button>
        <button id="export-csv-button" class="csv-action" type="button">CSV出力</button>
        <input id="import-csv-input" type="file" accept=".csv,text/csv" hidden>
      </div>
    </div>
    <div id="filter-modes" class="filter-modes" role="group" aria-label="絞り込み方法">
      <button class="mode-btn active" type="button" data-mode="all">すべて</button>
      <button class="mode-btn" type="button" data-mode="shape">形状</button>
      <button class="mode-btn" type="button" data-mode="order">覚える順</button>
      <button class="mode-btn" type="button" data-mode="tag">タグ</button>
    </div>
    <div id="tag-filter" class="tag-filter" hidden></div>
  </header>
  <main>
    <div id="status" class="status">データを読み込んでいます…</div>
    <div id="empty-filter" class="empty-filter" hidden>該当するケースがありません。</div>
    <div id="oll-grid" class="oll-grid" hidden></div>
  </main>

  <script src="oll-csv.js" defer></script>
  <script src="oll-cards.js" defer></script>
  <script src="oll-filters.js" defer></script>
  <script src="oll.js" defer></script>
</body>

</html>
