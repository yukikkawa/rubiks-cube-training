<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLL 手順一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --border: #d8dce3;
      --text: #1a1a1a;
      --muted: #5f6368;
      --bg: #f4f5f7;
      --card: #fff;
      --accent: #1a73e8;
      --tag-filter-transition-duration: 0.3s;
      --tag-filter-transition: opacity var(--tag-filter-transition-duration) ease, max-height var(--tag-filter-transition-duration) ease, margin-top var(--tag-filter-transition-duration) ease, visibility var(--tag-filter-transition-duration) ease;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans JP", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(244, 245, 247, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .filter-modes {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .csv-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      margin-left: auto;
    }

    .csv-action {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 9px;
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-size: 0.8125rem;
      cursor: pointer;
    }

    .csv-action:hover {
      border-color: #b8c4d9;
      background: #f8faff;
    }

    .mode-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      line-height: 1.2;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .mode-btn:hover {
      border-color: #b8c4d9;
      background: #f8faff;
    }

    .mode-btn.active {
      border-color: var(--accent);
      background: #e8f0fe;
      color: var(--accent);
      font-weight: 700;
    }

    .tag-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      transition: var(--tag-filter-transition);
      max-height: 500px;
      overflow: hidden;
    }

    .tag-filter.is-hidden {
      max-height: 0;
      margin-top: 0;
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    .tag-filter[hidden] {
      display: none;
    }

    .tag-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      line-height: 1.2;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .tag-btn:hover {
      border-color: #b8c4d9;
      background: #f8faff;
    }

    .tag-btn.active {
      border-color: var(--accent);
      background: #e8f0fe;
      color: var(--accent);
      font-weight: 700;
    }

    .tag-btn.learn-order {
      color: var(--text);
    }

    .tag-stars,
    .oll-learn-order-stars {
      color: #eab308;
    }

    .empty-filter {
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .status {
      padding: 12px 16px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .status.error {
      color: #b3261e;
      border-color: #f5c2c0;
      background: #fff5f5;
    }

    .oll-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr));
      gap: 12px;
    }

    .oll-card {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 12px;
      align-items: start;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      min-height: 132px;
    }

    .oll-card.is-filtered-out {
      display: none !important;
    }

    .oll-image-wrap {
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 8px;
      overflow: hidden;
    }

    .oll-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .oll-image-placeholder {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      padding: 8px;
    }

    .oll-body {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .oll-card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .oll-no {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      background: #e8f0fe;
      border-radius: 999px;
      padding: 2px 8px;
      margin-bottom: 8px;
    }

    .oll-card-head .oll-no {
      flex: 0 0 auto;
      margin-bottom: 0;
    }

    .oll-algorithm {
      margin: 0 0 10px;
      font-family: "JetBrains Mono", monospace;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .oll-algorithm-editor {
      min-width: 0;
      margin-bottom: 10px;
    }

    .oll-algorithm-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .oll-algorithm-row .oll-algorithm {
      flex: 1;
      min-width: 0;
      margin-bottom: 0;
    }

    .oll-algorithm-input {
      display: block;
      width: 100%;
      min-height: 4.5em;
      font-family: "JetBrains Mono", monospace;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.55;
      resize: vertical;
      white-space: pre-wrap;
    }

    .oll-algorithm-controls {
      display: flex;
      flex: 0 0 auto;
      gap: 4px;
    }

    .oll-algorithm-input[hidden],
    .oll-algorithm-controls[hidden] {
      display: none;
    }

    .oll-algorithm-action {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 6px;
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 0.75rem;
    }

    .oll-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .oll-category,
    .oll-name {
      margin: 0;
      font-size: 0.8125rem;
      color: var(--muted);
      line-height: 1.45;
      word-break: break-word;
    }

    .oll-name {
      font-weight: 500;
    }

    .oll-editable {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: inherit;
      font: inherit;
      line-height: inherit;
      padding: 1px 3px;
    }

    .oll-editable:hover,
    .oll-editable:focus {
      border-color: var(--border);
      background: var(--card);
      outline: none;
    }

    .oll-editable::placeholder {
      color: var(--muted);
      opacity: 0.8;
    }

    .oll-name-input {
      flex: 1;
      width: auto;
      min-width: 0;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .oll-order-input {
      width: 4.5rem;
      color: var(--text);
    }

    .oll-memo-input {
      display: block;
      grid-column: 1 / -1;
      font-size: 0.85rem;
      min-height: 2em;
      overflow: hidden;
      overflow-wrap: anywhere;
      resize: none;
      margin-top: 0;
      padding-top: 0px;
      padding-bottom: 0px;
      white-space: pre-wrap;
    }

    .oll-learn-order {
      color: var(--text);
      letter-spacing: 0;
    }

    .oll-memo {
      margin: 8px 0 0;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .oll-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 3px 4px;
      margin-top: 4px;
    }

    .oll-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .oll-tag-remove {
      appearance: none;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      line-height: 1;
    }

    .oll-tag-input {
      width: 7rem;
      font-size: 0.75rem;
    }

    .oll-tag-add {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 0.75rem;
    }

    @media (max-width: 520px) {
      .oll-card {
        grid-template-columns: 96px 1fr;
      }

      .oll-image-wrap {
        width: 96px;
        height: 96px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-top">
      <div>
        <h1>OLL 手順一覧</h1>
        <p id="summary">読み込み中…</p>
      </div>
      <div class="csv-actions">
        <button id="import-csv-button" class="csv-action" type="button">CSV読み込み</button>
        <button id="export-csv-button" class="csv-action" type="button">CSV出力</button>
        <input id="import-csv-input" type="file" accept=".csv,text/csv" hidden>
      </div>
    </div>
    <div id="filter-modes" class="filter-modes" role="group" aria-label="絞り込み方法">
      <button class="mode-btn active" type="button" data-mode="all">すべて</button>
      <button class="mode-btn" type="button" data-mode="shape">形状</button>
      <button class="mode-btn" type="button" data-mode="order">覚える順</button>
      <button class="mode-btn" type="button" data-mode="tag">タグ</button>
    </div>
    <div id="tag-filter" class="tag-filter" hidden></div>
  </header>
  <main>
    <div id="status" class="status">データを読み込んでいます…</div>
    <div id="empty-filter" class="empty-filter" hidden>該当するケースがありません。</div>
    <div id="oll-grid" class="oll-grid" hidden></div>
  </main>

  <script>
    const IMAGE_EXTENSIONS = ["png", "jpg", "jpeg", "webp", "gif", "svg"];
    const ENTRY_EDITS_KEY = "oll-entry-edits";
    const CSV_SOURCE_KEY = "oll-csv-source";

    function loadEntryEdits() {
      try {
        return JSON.parse(localStorage.getItem(ENTRY_EDITS_KEY) ?? "{}") || {};
      } catch {
        return {};
      }
    }

    function saveEntryEdit(no, field, value) {
      try {
        const edits = loadEntryEdits();
        edits[no] = { ...(edits[no] ?? {}), [field]: value };
        localStorage.setItem(ENTRY_EDITS_KEY, JSON.stringify(edits));
      } catch {
        // localStorageが利用できない環境では保存しない
      }
    }

    function getEntryTags(entry) {
      if (Array.isArray(entry["タグ"])) {
        return [...new Set(entry["タグ"].map((tag) => String(tag).trim()).filter(Boolean))];
      }
      const csvTags = Object.keys(entry)
        .filter((key) => /^タグ\d+$/.test(key))
        .sort((a, b) => Number(a.slice(2)) - Number(b.slice(2)))
        .map((key) => entry[key].trim())
        .filter(Boolean);
      return [...new Set(csvTags)];
    }

    function getAllTags(entries) {
      return new Set(entries.flatMap((entry) => getEntryTags(entry)));
    }

    function downloadCsv(entries) {
      const editsByNo = loadEntryEdits();
      const exportRows = entries.map((entry) => {
        const data = { ...entry };
        const edits = editsByNo[entry["No."]] ?? {};
        for (const field of ["通称", "メモ", "覚える順", "手順", "AUF"]) {
          if (typeof edits[field] === "string") {
            data[field] = edits[field];
          }
        }
        if (Array.isArray(edits["タグ"])) {
          data["タグ"] = edits["タグ"];
        }

        const tags = getEntryTags(data);
        for (const key of Object.keys(data)) {
          if (key === "タグ" || /^タグ\d+$/.test(key)) {
            delete data[key];
          }
        }
        return { data, tags };
      });

      const headers = [...new Set(exportRows.flatMap(({ data }) => Object.keys(data)))];
      const tagColumnCount = Math.max(3, ...exportRows.map(({ tags }) => tags.length));
      for (let index = 1; index <= tagColumnCount; index += 1) {
        headers.push(`タグ${index}`);
      }

      const escapeCsv = (value) => {
        const text = String(value ?? "");
        return /[",\r\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
      };
      const lines = [headers, ...exportRows.map(({ data, tags }) => headers.map((header) => {
        const tagMatch = header.match(/^タグ(\d+)$/);
        return tagMatch ? tags[Number(tagMatch[1]) - 1] ?? "" : data[header] ?? "";
      }))];
      const csv = `\uFEFF${lines.map((line) => line.map(escapeCsv).join(",")).join("\r\n")}`;
      const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = "oll_def.csv";
      link.click();
      URL.revokeObjectURL(url);
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (char === "\"" && next === "\"") {
            field += "\"";
            i += 1;
          } else if (char === "\"") {
            inQuotes = false;
          } else {
            field += char;
          }
          continue;
        }

        if (char === "\"") {
          inQuotes = true;
        } else if (char === ",") {
          row.push(field);
          field = "";
        } else if (char === "\n") {
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
        } else if (char === "\r") {
          // ignore
        } else {
          field += char;
        }
      }

      if (field.length > 0 || row.length > 0) {
        row.push(field);
        rows.push(row);
      }

      if (rows.length === 0) {
        return [];
      }

      const headers = rows[0].map((header) => header.trim());
      return rows.slice(1)
        .filter((cells) => cells.some((cell) => cell.trim() !== ""))
        .map((cells) => {
          const entry = {};
          headers.forEach((header, index) => {
            entry[header] = (cells[index] ?? "").trim();
          });
          return entry;
        });
    }

    function imageCandidates(no) {
      const num = String(no).trim().padStart( 2, '0');
      const padded = num.padStart(2, "0");
      const bases = [`../images/oll${num}`, `images/${padded}`, `images/oll-${num}`, `images/oll-${padded}`];
      const paths = [];
      for (const base of bases) {
        for (const ext of IMAGE_EXTENSIONS) {
          paths.push(`${base}.${ext}`);
        }
      }
      return paths;
    }

    function loadImage(candidates) {
      return new Promise((resolve) => {
        let index = 0;

        const tryNext = () => {
          if (index >= candidates.length) {
            resolve(null);
            return;
          }

          const src = candidates[index];
          index += 1;
          const img = new Image();
          img.onload = () => resolve(src);
          img.onerror = tryNext;
          img.src = src;
        };

        tryNext();
      });
    }

    function uniqueValues(entries, key) {
      const counts = new Map();
      for (const entry of entries) {
        const value = (entry[key] ?? "").trim();
        if (!value) {
          continue;
        }
        counts.set(value, (counts.get(value) ?? 0) + 1);
      }
      return [...counts.entries()]
        .sort(([a], [b]) => a.localeCompare(b, "ja"))
        .map(([value, count]) => ({ value, count }));
    }

    function getShape(entry) {
      return (entry["形状"] ?? "").trim();
    }

    function getLearnOrder(entry) {
      return (entry["覚える順"] ?? "").trim();
    }

    function getStars(value) {
      const order = Number.parseInt(value, 10);
      return Number.isInteger(order) && order > 0 ? "★".repeat(order) : "";
    }

    function getLearnOrderStars(entry) {
      return getStars(getLearnOrder(entry));
    }

    function getAufRotation(auf) {
      switch ((auf ?? "").trim().toLowerCase()) {
        case "y":
          return 90;
        case "y'":
          return -90;
        case "y2":
          return 180;
        default:
          return 0;
      }
    }

    function createCard(entry, allTags) {
      const card = document.createElement("article");
      card.className = "oll-card";
      card.setAttribute("data-shape", getShape(entry));
      card.setAttribute("data-order", getLearnOrder(entry));
      card.dataset.tags = JSON.stringify(getEntryTags(entry));

      const imageWrap = document.createElement("div");
      imageWrap.className = "oll-image-wrap";

      const body = document.createElement("div");
      body.className = "oll-body";

      const no = document.createElement("span");
      no.className = "oll-no";
      no.textContent = `#${entry["No."]}`;

      const algorithmEditor = document.createElement("div");
      algorithmEditor.className = "oll-algorithm-editor";

      const algorithmRow = document.createElement("div");
      algorithmRow.className = "oll-algorithm-row";

      const algorithm = document.createElement("p");
      algorithm.className = "oll-algorithm";
      algorithm.textContent = entry["手順"] || "—";

      const algorithmInput = document.createElement("textarea");
      algorithmInput.className = "oll-editable oll-algorithm-input";
      algorithmInput.hidden = true;
      algorithmInput.setAttribute("aria-label", `OLL ${entry["No."]} の手順とAUFを編集`);

      const algorithmControls = document.createElement("div");
      algorithmControls.className = "oll-algorithm-controls";

      const editAlgorithmButton = document.createElement("button");
      editAlgorithmButton.className = "oll-algorithm-action";
      editAlgorithmButton.type = "button";
      editAlgorithmButton.textContent = "編集";
      editAlgorithmButton.setAttribute("aria-label", `OLL ${entry["No."]} の手順を編集`);

      const editingActions = document.createElement("div");
      editingActions.className = "oll-algorithm-controls";
      editingActions.hidden = true;

      const saveAlgorithmButton = document.createElement("button");
      saveAlgorithmButton.className = "oll-algorithm-action";
      saveAlgorithmButton.type = "button";
      saveAlgorithmButton.textContent = "完了";

      const cancelAlgorithmButton = document.createElement("button");
      cancelAlgorithmButton.className = "oll-algorithm-action";
      cancelAlgorithmButton.type = "button";
      cancelAlgorithmButton.textContent = "キャンセル";

      let algorithmImage = null;
      const setAlgorithmEditing = (editing) => {
        algorithmInput.hidden = !editing;
        algorithm.hidden = editing;
        algorithmControls.hidden = editing;
        editingActions.hidden = !editing;
      };

      editAlgorithmButton.addEventListener("click", () => {
        algorithmInput.value = [entry["AUF"], entry["手順"]]
          .map((value) => (value ?? "").trim())
          .filter(Boolean)
          .join(" ");
        setAlgorithmEditing(true);
        algorithmInput.focus();
      });

      saveAlgorithmButton.addEventListener("click", () => {
        const editedText = algorithmInput.value.trim();
        const aufMatch = editedText.match(/^([yY](?:2|')?)(?:\s+|$)/);
        entry["AUF"] = aufMatch ? aufMatch[1].toLowerCase() : "";
        entry["手順"] = aufMatch ? editedText.slice(aufMatch[0].length).trim() : editedText;
        algorithm.textContent = entry["手順"] || "—";
        if (algorithmImage) {
          algorithmImage.style.transform = `rotate(${getAufRotation(entry["AUF"])}deg)`;
        }
        saveEntryEdit(entry["No."], "AUF", entry["AUF"]);
        saveEntryEdit(entry["No."], "手順", entry["手順"]);
        setAlgorithmEditing(false);
      });

      cancelAlgorithmButton.addEventListener("click", () => setAlgorithmEditing(false));
      algorithmInput.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          setAlgorithmEditing(false);
        }
      });

      algorithmControls.append(editAlgorithmButton);
      editingActions.append(saveAlgorithmButton, cancelAlgorithmButton);
      algorithmRow.append(algorithm, algorithmControls);
      algorithmEditor.append(algorithmRow, algorithmInput, editingActions);

      const name = document.createElement("input");
      name.className = "oll-editable oll-name-input";
      name.type = "text";
      name.value = entry["通称"] || "";
      name.placeholder = "通称";
      name.setAttribute("aria-label", `OLL ${entry["No."]} の通称`);
      name.addEventListener("change", () => saveEntryEdit(entry["No."], "通称", name.value));

      const cardHead = document.createElement("div");
      cardHead.className = "oll-card-head";
      cardHead.append(no, name);

      const meta = document.createElement("div");
      meta.className = "oll-meta";

      const categoryLine = document.createElement("p");
      categoryLine.className = "oll-category";
      const rate = entry["出現率"] ? ` · ${entry["出現率"]}` : "";
      categoryLine.textContent = `${getShape(entry)}${rate}`.trim() || "—";

      const learnOrder = document.createElement("p");
      learnOrder.className = "oll-category oll-learn-order";
      const learnOrderLabel = document.createTextNode("覚える順: ");
      const orderInput = document.createElement("input");
      orderInput.className = "oll-editable oll-order-input";
      orderInput.type = "number";
      orderInput.min = "1";
      orderInput.step = "1";
      orderInput.value = getLearnOrder(entry);
      orderInput.placeholder = "未設定";
      orderInput.setAttribute("aria-label", `OLL ${entry["No."]} の覚える順`);
      const starsElement = document.createElement("span");
      starsElement.className = "oll-learn-order-stars";
      starsElement.textContent = getLearnOrderStars(entry);
      learnOrder.append(learnOrderLabel, starsElement, " ", orderInput);

      orderInput.addEventListener("input", () => {
        const value = orderInput.value.trim();
        const stars = getStars(value);
        card.setAttribute("data-order", value);
        starsElement.textContent = stars;
        saveEntryEdit(entry["No."], "覚える順", value);
      });

      meta.append(categoryLine, learnOrder);
      body.append(cardHead, algorithmEditor, meta);

      const memo = document.createElement("textarea");
      memo.className = "oll-editable oll-memo-input";
      memo.value = entry["メモ"] === "メモ" ? "" : (entry["メモ"] ?? "");
      memo.placeholder = "メモ";
      memo.rows = 1;
      memo.setAttribute("aria-label", `OLL ${entry["No."]} のメモ`);
      const resizeMemo = () => {
        memo.style.height = "auto";
        memo.style.height = `${memo.scrollHeight}px`;
      };
      memo.addEventListener("input", () => {
        resizeMemo();
        saveEntryEdit(entry["No."], "メモ", memo.value);
      });

      const tags = getEntryTags(entry);
      const tagsElement = document.createElement("div");
      tagsElement.className = "oll-tags";
      tagsElement.setAttribute("data-no", entry["No."]);

      const tagInput = document.createElement("input");
      tagInput.className = "oll-editable oll-tag-input";
      tagInput.type = "text";
      tagInput.placeholder = "タグを追加";
      tagInput.setAttribute("list", `tag-options-${entry["No."]}`);
      tagInput.setAttribute("aria-label", `OLL ${entry["No."]} にタグを追加`);

      const tagOptions = document.createElement("datalist");
      tagOptions.id = `tag-options-${entry["No."]}`;
      const refreshTagOptions = () => {
        tagOptions.replaceChildren();
        [...allTags]
          .filter((tag) => !tags.includes(tag))
          .sort((a, b) => a.localeCompare(b, "ja"))
          .forEach((tag) => {
          const option = document.createElement("option");
          option.value = tag;
          tagOptions.append(option);
          });
      };
      refreshTagOptions();

      const saveTags = () => {
        card.dataset.tags = JSON.stringify(tags);
        saveEntryEdit(entry["No."], "タグ", tags);
      };

      const renderTags = () => {
        tagsElement.querySelectorAll(".oll-tag").forEach((tag) => tag.remove());
        for (const tag of tags) {
          const tagElement = document.createElement("span");
          tagElement.className = "oll-tag";
          tagElement.append(document.createTextNode(tag));

          const removeButton = document.createElement("button");
          removeButton.className = "oll-tag-remove";
          removeButton.type = "button";
          removeButton.textContent = "×";
          removeButton.setAttribute("aria-label", `${tag}を削除`);
          removeButton.addEventListener("click", () => {
            tags.splice(tags.indexOf(tag), 1);
            refreshTagOptions();
            renderTags();
            saveTags();
          });
          tagElement.append(removeButton);
          tagsElement.prepend(tagElement);
        }
      };

      const addTag = () => {
        const tag = tagInput.value.trim();
        if (!tag || tags.includes(tag)) {
          tagInput.value = "";
          return;
        }
        tags.push(tag);
        allTags.add(tag);
        refreshTagOptions();
        document.querySelectorAll("datalist[id^='tag-options-']").forEach((list) => {
          if (list !== tagOptions && ![...list.options].some((option) => option.value === tag)) {
            const option = document.createElement("option");
            option.value = tag;
            list.append(option);
          }
        });
        tagInput.value = "";
        renderTags();
        saveTags();
      };

      const addTagButton = document.createElement("button");
      addTagButton.className = "oll-tag-add";
      addTagButton.type = "button";
      addTagButton.textContent = "追加";
      addTagButton.addEventListener("click", addTag);
      tagInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          addTag();
        }
      });

      tagsElement.append(tagInput, addTagButton);
      renderTags();

      body.append(tagsElement);
      card.append(imageWrap, body, memo, tagOptions);
      requestAnimationFrame(resizeMemo);

      loadImage(imageCandidates(entry["No."])).then((src) => {
        if (src) {
          const img = document.createElement("img");
          img.src = src;
          img.alt = `OLL ${entry["No."]}`;
          img.style.transform = `rotate(${getAufRotation(entry["AUF"])}deg)`;
          algorithmImage = img;
          imageWrap.append(img);
        } else {
          const placeholder = document.createElement("div");
          placeholder.className = "oll-image-placeholder";
          placeholder.textContent = "画像なし";
          imageWrap.append(placeholder);
        }
      });

      return card;
    }

    function createTagFilter(values, label, onSelect) {
      const container = document.createElement("div");
      container.className = "tag-filter";
      container.setAttribute("role", "group");
      container.setAttribute("aria-label", `${label}で絞り込み`);

      const allButton = document.createElement("button");
      allButton.type = "button";
      allButton.className = "tag-btn active";
      allButton.setAttribute("data-tag", "");
      allButton.textContent = "すべて";
      allButton.addEventListener("click", () => onSelect(""));
      container.append(allButton);

      for (const { value, count } of values) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tag-btn";
        if (label === "覚える順") {
          button.classList.add("learn-order");
        }
        button.setAttribute("data-tag", value);
        const displayValue = label === "覚える順" ? getStars(value) || value : value;
        if (label === "覚える順" && getStars(value)) {
          const starsElement = document.createElement("span");
          starsElement.className = "tag-stars";
          starsElement.textContent = displayValue;
          button.append(starsElement);
          button.append(` (${count})`);
        } else {
          button.textContent = `${displayValue} (${count})`;
        }
        button.addEventListener("click", () => onSelect(value));
        container.append(button);
      }

      return container;
    }

    function getTagValue(button) {
      return button.getAttribute("data-tag") ?? "";
    }

    const FILTER_STATE_KEY = "oll-filter-state";

    function loadFilterState() {
      try {
        return JSON.parse(localStorage.getItem(FILTER_STATE_KEY) ?? "{}") || {};
      } catch {
        return {};
      }
    }

    function saveFilterState(state) {
      try {
        localStorage.setItem(FILTER_STATE_KEY, JSON.stringify(state));
      } catch {
        // localStorageが利用できない環境では保存しない
      }
    }

    function applyTagFilter(selectedTag, mode, gridEl, summary, emptyFilter, tagFilter) {
      const cards = gridEl.querySelectorAll(".oll-card");
      let visibleCount = 0;
      const dataAttribute = mode === "shape" ? "data-shape" : "data-order";

      for (const card of cards) {
        const value = mode === "tag"
          ? JSON.parse(card.dataset.tags ?? "[]")
          : [card.getAttribute(dataAttribute) ?? ""];
        const visible = selectedTag === "" || value.includes(selectedTag);
        card.classList.toggle("is-filtered-out", !visible);
        if (visible) {
          visibleCount += 1;
        }
      }

      for (const button of tagFilter.querySelectorAll(".tag-btn")) {
        button.classList.toggle("active", getTagValue(button) === selectedTag);
      }

      emptyFilter.hidden = visibleCount > 0;
      gridEl.hidden = visibleCount === 0;

      if (selectedTag) {
        summary.textContent = `${visibleCount} / ${cards.length} ケース（${selectedTag}）`;
      } else {
        summary.textContent = `${cards.length} ケース`;
      }
    }

    async function init() {
      const status = document.getElementById("status");
      const grid = document.getElementById("oll-grid");
      const summary = document.getElementById("summary");
      const tagFilterRoot = document.getElementById("tag-filter");
      const modeButtons = document.querySelectorAll(".mode-btn");
      const emptyFilter = document.getElementById("empty-filter");
      const importCsvButton = document.getElementById("import-csv-button");
      const exportCsvButton = document.getElementById("export-csv-button");
      const importCsvInput = document.getElementById("import-csv-input");

      importCsvButton.addEventListener("click", () => importCsvInput.click());
      exportCsvButton.addEventListener("click", () => {
        if (window.ollEntries) {
          downloadCsv(window.ollEntries);
        }
      });
      importCsvInput.addEventListener("change", async () => {
        const file = importCsvInput.files?.[0];
        if (!file) {
          return;
        }
        try {
          const csvText = await file.text();
          const importedEntries = parseCsv(csvText);
          if (importedEntries.length === 0 || !Object.hasOwn(importedEntries[0], "No.")) {
            throw new Error("No.列を含むOLL CSVを選択してください");
          }
          localStorage.setItem(CSV_SOURCE_KEY, csvText);
          localStorage.removeItem(ENTRY_EDITS_KEY);
          location.reload();
        } catch (error) {
          status.className = "status error";
          status.hidden = false;
          status.textContent = `CSVの読み込みに失敗しました: ${error.message}`;
        } finally {
          importCsvInput.value = "";
        }
      });

      try {
        let text = localStorage.getItem(CSV_SOURCE_KEY);
        if (text === null) {
          const response = await fetch("oll_def.csv");
          if (!response.ok) {
            throw new Error(`oll_def.csv の読み込みに失敗しました (${response.status})`);
          }
          text = await response.text();
        }

        const entries = parseCsv(text);

        if (entries.length === 0) {
          throw new Error("oll_def.csv にデータがありません");
        }

        const entryEdits = loadEntryEdits();
        for (const entry of entries) {
          const edits = entryEdits[entry["No."]];
          if (edits) {
            for (const field of ["通称", "メモ", "覚える順", "タグ", "手順", "AUF"]) {
              if (typeof edits[field] === "string") {
                entry[field] = edits[field];
              } else if (field === "タグ" && Array.isArray(edits[field])) {
                entry[field] = edits[field];
              }
            }
          }
        }

        status.hidden = true;
        grid.hidden = false;
        summary.textContent = `${entries.length} ケース`;
        window.ollEntries = entries;

        const allTags = getAllTags(entries);
        const fragment = document.createDocumentFragment();
        for (const entry of entries) {
          fragment.append(createCard(entry, allTags));
        }
        grid.append(fragment);

        let tagFilter = tagFilterRoot;
        let tagFilterScrollController = null;
        const filterState = loadFilterState();
        let selectedMode = "all";

        const selectMode = (mode) => {
          selectedMode = mode;
          filterState.mode = mode;
          saveFilterState(filterState);
          for (const button of modeButtons) {
            button.classList.toggle("active", button.dataset.mode === mode);
          }

          if (mode === "all") {
            tagFilter.hidden = true;
            tagFilter.classList.remove("is-hidden");
            applyTagFilter("", mode, grid, summary, emptyFilter, tagFilter);
            return;
          }

          const key = mode === "shape" ? "形状" : mode === "order" ? "覚える順" : null;
          const label = mode === "shape" ? "形状" : mode === "order" ? "覚える順" : "タグ";
          const values = mode === "tag"
            ? [...allTags].sort((a, b) => a.localeCompare(b, "ja")).map((value) => ({
              value,
              count: entries.filter((entry) => getEntryTags(entry).includes(value)).length
            }))
            : uniqueValues(entries, key);
          const savedTag = values.some(({ value }) => value === filterState[mode]) ? filterState[mode] : "";
          const nextTagFilter = createTagFilter(values, label, (tag) => {
            filterState[mode] = tag;
            saveFilterState(filterState);
            applyTagFilter(tag, selectedMode, grid, summary, emptyFilter, nextTagFilter);
          });
          tagFilter.replaceWith(nextTagFilter);
          tagFilter = nextTagFilter;
          tagFilter.hidden = false;
          tagFilterScrollController = setupScrollHideTagFilter(tagFilter);
          applyTagFilter(savedTag, mode, grid, summary, emptyFilter, tagFilter);
        };

        for (const button of modeButtons) {
          button.addEventListener("click", () => {
            const mode = button.dataset.mode;
            if (mode === selectedMode && mode !== "all") {
              const isHidden = tagFilter.classList.contains("is-hidden");
              tagFilter.classList.toggle("is-hidden", !isHidden);
              if (isHidden) {
                tagFilterScrollController?.keepVisibleDuringTransition();
              }
              return;
            }
            selectMode(mode);
          });
        }

        const savedMode = ["all", "shape", "order", "tag"].includes(filterState.mode) ? filterState.mode : "all";
        selectMode(savedMode);
      } catch (error) {
        status.className = "status error";
        status.textContent = `${error.message}。ローカルサーバー経由で開いてください（例: \`npx serve .\`）。`;
        summary.textContent = "読み込み失敗";
      }
    }
    
    function setupScrollHideTagFilter(tagFilterElement) {
        let lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
        let isTransitioning = false; // 状態変更中フラグ
      let ignoreHideUntil = 0;
        
        // 誤作動防止のための閾値（微小なスクロールで反応しないようにする）
        const THRESHOLD = 10; 
        // ヘッダーや要素自体の高さを考慮した最低スクロール量
        const TOP_OFFSET = 50; 
        // CSSの --tag-filter-transition-duration から取得（秒 → ミリ秒）
        const durationStr = getComputedStyle(document.documentElement).getPropertyValue('--tag-filter-transition-duration').trim();
        const TRANSITION_DURATION = parseFloat(durationStr) * 1000 * 1.05;

        const keepVisibleDuringTransition = () => {
          lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
          ignoreHideUntil = performance.now() + TRANSITION_DURATION + 100;
        };

        window.addEventListener("scroll", () => {
          const currentScrollY = window.pageYOffset || document.documentElement.scrollTop;

            // 状態変更中はスクロールイベントを無視
            if (isTransitioning) {
            lastScrollY = currentScrollY;
                return;
            }

          if (performance.now() < ignoreHideUntil) {
            lastScrollY = currentScrollY;
            return;
          }

            const delta = currentScrollY - lastScrollY;

            // スクロール量が小さすぎる場合は無視（手ぶれ対策）
            if (Math.abs(delta) < THRESHOLD) {
                return;
            }

            // 下スクロール ＝ 非表示
            if (delta > 0) {
              if (!tagFilterElement.classList.contains("is-hidden")) {
                    isTransitioning = true;
                    tagFilterElement.classList.add("is-hidden");
                    setTimeout(() => {
                        isTransitioning = false;
                        lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
                    }, TRANSITION_DURATION);
                }
            }

            lastScrollY = currentScrollY;
        });

    return { keepVisibleDuringTransition };
    }
    init();
  </script>
